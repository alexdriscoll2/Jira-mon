services:
  db:
    image: postgres:17
    container_name: jiramon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jiramon
      POSTGRES_PASSWORD: jiramon_dev
      POSTGRES_DB: jiramon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiramon -d jiramon"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: